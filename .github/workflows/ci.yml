name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-release-gate:
    uses: myrgic/.github/.github/workflows/public-release-gate.yml@main

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned deliberately. The repo carries no [tool.ruff] config, so lint
        # runs against ruff's *default* rule set. ruff 0.16.0 widened that
        # default well beyond E4/E7/E9/F (BLE001, S110, I001, RUF100, PLR0133,
        # RUF059), which turned every unchanged file into a lint failure.
        # Bumping this pin means auditing the new defaults first.
        run: pip install ruff==0.15.22
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format --check
        run: ruff format --check src tests scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install package with dev + evals extras
        run: uv pip install --system -e ".[dev,evals]"
      - name: Run pytest
        run: pytest tests/ evals/tournament/tests/ evals/harness/tests/ -v --tb=short

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
